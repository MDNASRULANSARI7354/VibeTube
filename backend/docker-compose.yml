version: '3.8'

services:
  app:
    image: php:8.3-fpm
    container_name: vibetube_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: vibetube
      DB_USERNAME: postgres
      DB_PASSWORD: secret
    depends_on:
      - postgres
      - minio

  nginx:
    image: nginx:alpine
    container_name: vibetube_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  postgres:
    image: postgres:16-alpine
    container_name: vibetube_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vibetube
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: vibetube_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
